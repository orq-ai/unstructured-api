[project]
name = "unstructured-api"
version = "0.0.0"
description = "orq.ai fork of the unstructured partition API"
# the unstructured==0.23.1 dependency tree resolves only on 3.11-3.13;
# Dockerfile builds on 3.12
requires-python = ">=3.12,<3.14"
dependencies = [
    "unstructured[all-docs]==0.23.1",
    "pdfminer-six>=20251230",
    # Pinning click due to a unicode issue in black
    # can remove after black drops support for Python 3.6
    # ref: https://github.com/psf/black/issues/2964
    "click==8.1.3",
    "fastapi",
    # security floor: GHSA-f96h-pmfr-66vw, GHSA-7f5h-v6xp-fcq8, GHSA-86qp-5c8j-p5mr,
    # GHSA-wqp7-x3pw-xc5r, GHSA-x746-7m8f-x49c, GHSA-82w8-qh3p-5jfq
    "starlette>=1.3.1",
    "uvicorn",
    "ratelimit",
    "requests",
    "backoff",
    "pypdf>=6.9.2",
    "pycryptodome",
    "psutil",
    "pypdfium2",
    "tiktoken",
    "minio",
    "motor",
    "pymongo",
    "sentry-sdk[fastapi]",
    "python-dotenv",
    "nats-py",
    "python-ulid",
    "PyJWT>=2.8.0",
    # FastAPI form/multipart file uploads (UploadFile in general.py); was previously
    # only a transitive dep and got dropped on recompile, breaking route registration.
    "python-multipart",
]

[dependency-groups]
dev = [
    "black",
    "flake8",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "httpx",
    "deepdiff",
    "nbdev",
    "jupyter",
]

[tool.uv]
# not an installable package; uv sync manages the environment only
package = false
constraint-dependencies = ["numpy<3.0.0"]

[tool.black]
line-length = 100

[tool.pyright]
pythonPlatform = "Linux"
pythonVersion = "3.9"
reportUnnecessaryCast = true
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100
select = [
    "C4",       # -- flake8-comprehensions --
    "COM",      # -- flake8-commas --
    "E",        # -- pycodestyle errors --
    "F",        # -- pyflakes --
    "I",        # -- isort (imports) --
    "PLR0402",  # -- Name compared with itself like `foo == foo` --
    "PT",       # -- flake8-pytest-style --
    "SIM",      # -- flake8-simplify --
    "UP015",    # -- redundant `open()` mode parameter (like "r" is default) --
    "UP018",    # -- Unnecessary {literal_type} call like `str("abc")`. (rewrite as a literal) --
    "UP032",    # -- Use f-string instead of `.format()` call --
    "UP034",    # -- Avoid extraneous parentheses --
]
ignore = [
    "COM812",   # -- over aggressively insists on trailing commas where not desireable --
    "PT011",    # -- pytest.raises({exc}) too broad, use match param or more specific exception --
    "PT012",    # -- pytest.raises() block should contain a single simple statement --
    "SIM117",   # -- merge `with` statements for context managers that have same scope --
]

[tool.ruff.lint.isort]
known-first-party = [
    "unstructured",
    "unstructured_inference",
]
